<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable Item Card with Interactive Hover Reveal -->
<div th:fragment="card(item)" 
     class="item-card relative bg-white dark:bg-mono-900 border border-mono-200 dark:border-mono-800 rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group">
    
    <!-- Image Box with Unique SKU Badge and Category -->
    <div class="relative w-full h-56 bg-mono-100 dark:bg-mono-950 overflow-hidden">
        <img th:src="${item.primaryImageUrl}" th:alt="${item.name}"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        
        <!-- Unique Asset Tracking Code Badge -->
        <div class="absolute top-3 left-3 bg-black/80 dark:bg-white/90 backdrop-blur text-white dark:text-black font-mono text-[10px] font-semibold px-2 py-0.5 rounded shadow">
            <span th:text="${item.itemCode}">RIMS-EQ-1001</span>
        </div>

        <!-- Category Badge -->
        <div class="absolute top-3 right-3 bg-mono-900/80 dark:bg-mono-950/80 backdrop-blur text-mono-200 font-medium text-[10px] px-2 py-0.5 rounded border border-mono-700">
            <span th:text="${item.category.name}">Category</span>
        </div>

        <!-- Multi-photo count indicator if more than 1 -->
        <div th:if="${item.images != null && item.images.size() > 1}" 
             class="absolute bottom-3 right-3 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center space-x-1 font-mono">
            <i data-lucide="images" class="w-3 h-3"></i>
            <span th:text="${item.images.size()}">2</span>
        </div>

        <!-- ======================================================== -->
        <!-- HOVER OVERLAY: REVEALS DESCRIPTION, SPECS & SELLER ON HOVER -->
        <!-- ======================================================== -->
        <div class="card-hover-overlay rims-glass-overlay absolute inset-0 bg-white/95 dark:bg-mono-950/95 backdrop-blur-md p-4 flex flex-col justify-between z-20">
            <div>
                <div class="flex items-center justify-between text-[11px] font-mono text-mono-500 mb-1">
                    <span>ITEM OVERVIEW</span>
                    <span th:text="${item.itemCode}">RIMS-001</span>
                </div>
                <h4 class="font-bold text-xs text-mono-900 dark:text-mono-100 line-clamp-1 mb-2" th:text="${item.name}">Product Name</h4>
                <!-- The revealed description -->
                <p class="text-xs text-mono-700 dark:text-mono-300 leading-relaxed line-clamp-4" th:text="${item.description}">
                    Description reveals immediately on hover...
                </p>
            </div>

            <div class="pt-3 border-t border-mono-200 dark:border-mono-800">
                <!-- Seller Institution Info -->
                <div class="flex items-center space-x-1.5 text-[11px] text-mono-600 dark:text-mono-400 mb-2">
                    <i data-lucide="building-2" class="w-3.5 h-3.5 flex-shrink-0"></i>
                    <span class="truncate font-medium" th:text="${item.seller.organizationName != null ? item.seller.organizationName : item.seller.name}">Seller Org</span>
                </div>

                <!-- Fast Action Button -->
                <a th:href="@{'/items/' + ${item.id}}" 
                   class="w-full block text-center py-1.5 px-3 rounded-lg text-xs font-semibold bg-black text-white dark:bg-white dark:text-black hover:opacity-90 shadow">
                    Inspect & Rent &rarr;
                </a>
            </div>
        </div>
    </div>

    <!-- Card Body (Always visible beneath image) -->
    <div class="p-4 flex-1 flex flex-col justify-between">
        <div>
            <!-- Seller Organization info -->
            <div class="flex items-center justify-between text-[11px] text-mono-500 dark:text-mono-400 mb-1">
                <span class="flex items-center space-x-1 truncate max-w-[180px]">
                    <i data-lucide="building" class="w-3 h-3"></i>
                    <span th:text="${item.seller.organizationName != null ? item.seller.organizationName : item.seller.name}">Apex Labs</span>
                </span>
                <span th:if="${item.availableQuantity > 0}" class="text-emerald-700 dark:text-emerald-400 font-mono text-[10px]">
                    <span th:text="${item.availableQuantity}">3</span> available
                </span>
                <span th:unless="${item.availableQuantity > 0}" class="text-rose-600 font-mono text-[10px]">
                    Rented Out
                </span>
            </div>

            <!-- Title -->
            <a th:href="@{'/items/' + ${item.id}}" class="block">
                <h3 class="font-bold text-sm text-mono-900 dark:text-mono-100 hover:underline line-clamp-1 group-hover:text-black dark:group-hover:text-white" 
                    th:text="${item.name}">
                    Item Title
                </h3>
            </a>

            <!-- Tags -->
            <div th:if="${!item.tagList.isEmpty()}" class="flex flex-wrap gap-1 mt-2">
                <a th:each="tag : ${item.tagList}" 
                   th:href="@{/items(tag=${tag})}"
                   class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-mono-100 dark:bg-mono-800 text-mono-600 dark:text-mono-400 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors"
                   th:text="'#' + ${tag}">#tag</a>
            </div>
        </div>

        <!-- Footer with Price and Quick Details -->
        <div class="pt-3 mt-3 border-t border-mono-100 dark:border-mono-800 flex items-center justify-between">
            <div>
                <span class="text-[10px] text-mono-500 uppercase font-mono block">Rental Rate</span>
                <div class="text-base font-extrabold text-mono-900 dark:text-mono-100">
                    ₹<span th:text="${#numbers.formatDecimal(item.pricePerDay, 1, 2)}">150.00</span>
                    <span class="text-xs font-normal text-mono-500 font-sans">/day</span>
                </div>
            </div>

            <a th:href="@{'/items/' + ${item.id}}" 
               class="p-2 rounded-lg border border-mono-200 dark:border-mono-700 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors"
               title="View Details">
                <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </a>
        </div>
    </div>
</div>

</body>
</html>
