<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer Login')}"></head>

<body class="bg-mono-50 dark:bg-mono-950 text-mono-900 dark:text-mono-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <!-- Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md p-8 rounded-2xl border border-mono-200 dark:border-mono-800 bg-white dark:bg-mono-900 shadow-xl">
            
            <!-- Header -->
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-xl bg-mono-100 dark:bg-mono-800 text-mono-900 dark:text-mono-100 flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="user" class="w-6 h-6"></i>
                </div>
                <div class="text-[11px] font-mono uppercase tracking-widest text-mono-500">Dedicated Portal</div>
                <h1 class="text-2xl font-extrabold tracking-tight mt-1">Customer Login</h1>
                <p class="text-xs text-mono-500 mt-1">Sign in to manage your rental carts, active leases, and receipts</p>
            </div>

            <!-- Login Form -->
            <form action="/login/buyer" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-mono-500 mb-1">Email Address</label>
                    <input type="email" name="email" value="buyer@customer.com" required
                           class="w-full px-3 py-2 text-xs rounded-lg border border-mono-300 dark:border-mono-700 bg-mono-50 dark:bg-mono-950 focus:outline-none focus:ring-1 focus:ring-black dark:focus:ring-white">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-mono uppercase tracking-wider text-mono-500">Password</label>
                    </div>
                    <input type="password" name="password" value="buyer123" required
                           class="w-full px-3 py-2 text-xs rounded-lg border border-mono-300 dark:border-mono-700 bg-mono-50 dark:bg-mono-950 focus:outline-none focus:ring-1 focus:ring-black dark:focus:ring-white">
                </div>

                <button type="submit" 
                        class="w-full py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-black text-white dark:bg-white dark:text-black hover:opacity-90 shadow">
                    Sign In to Customer Portal
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-mono-200 dark:border-mono-800 text-center space-y-3 text-xs">
                <div>
                    <span class="text-mono-500">Don't have a customer account?</span>
                    <a href="/register/buyer" class="font-bold underline ml-1 hover:text-black dark:hover:text-white">Sign Up Here</a>
                </div>

                <div class="pt-2 text-[11px] font-mono text-mono-500 flex justify-center space-x-3">
                    <a href="/login/seller" class="hover:underline">Seller Hub &rarr;</a>
                    <span>&bull;</span>
                    <a href="/login/admin" class="hover:underline">SUDO Admin &rarr;</a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer & Scripts -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
