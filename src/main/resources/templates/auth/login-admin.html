<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SUDO Admin Terminal')}"></head>

<body class="bg-mono-950 text-white min-h-screen flex flex-col font-sans">

    <!-- Header without full public nav, high security aesthetic -->
    <header class="border-b border-mono-800 bg-black/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded bg-white text-black font-extrabold flex items-center justify-center text-sm">R</div>
                <span class="font-mono text-xs font-bold tracking-widest text-mono-300">RIMS // ROOT ACCESS</span>
            </a>
            <a href="/" class="text-xs font-mono text-mono-400 hover:text-white flex items-center space-x-1">
                <span>Return to Public Site</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </a>
        </div>
    </header>

    <!-- Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md p-8 rounded-2xl border border-mono-800 bg-mono-900 shadow-2xl relative overflow-hidden">
            
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-mono-700 via-white to-mono-700"></div>

            <!-- Header -->
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-xl bg-white text-black flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <i data-lucide="shield-alert" class="w-6 h-6"></i>
                </div>
                <div class="text-[10px] font-mono uppercase tracking-widest text-mono-400">Restricted Administrative Gateway</div>
                <h1 class="text-2xl font-extrabold tracking-tight mt-1 text-white">SUDO Admin Terminal</h1>
                <p class="text-xs text-mono-400 mt-1">Platform-level oversight: inspect users, database credentials & delist items</p>
            </div>

            <!-- Login Form -->
            <form action="/login/admin" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-mono-400 mb-1">Root Administrator Email</label>
                    <input type="email" name="email" required placeholder="admin@domain.com"
                           class="w-full px-3 py-2 text-xs rounded-lg border border-mono-700 bg-mono-950 text-white focus:outline-none focus:ring-1 focus:ring-white">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-mono uppercase tracking-wider text-mono-400">Master Password</label>
                    </div>
                    <input type="password" name="password" required placeholder="Enter master password"
                           class="w-full px-3 py-2 text-xs rounded-lg border border-mono-700 bg-mono-950 text-white focus:outline-none focus:ring-1 focus:ring-white">
                </div>

                <button type="submit" 
                        class="w-full py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-white text-black hover:bg-mono-200 transition-colors shadow">
                    Authorize SUDO Access
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-mono-800 text-center text-xs text-mono-500 font-mono">
                <div>Restricted Gateway &bull; Encrypted Session</div>
                <div class="mt-1 text-[10px] text-mono-400">All authentication attempts are logged and monitored</div>
            </div>

        </div>
    </main>

    <!-- Footer & Scripts -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
