server.port=8080
server.address=0.0.0.0

# Session & Security Cookie Configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Application Details
spring.application.name=RIMS-RentalItemManagement

# SQL Database Configuration
# Supported options:
# 1) NEON_DATABASE_URL or DATABASE_URL: standard Neon connection string:
#    postgresql://neondb_owner:password@ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
# 2) Traditional Spring Boot datasource variables:
#    SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# 3) Default: Local persistent H2 file database
spring.datasource.url=${NEON_DATABASE_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rimsdb;AUTO_SERVER=TRUE}}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate Configuration
# Hibernate automatically detects PostgreSQLDialect when connecting to Neon / PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (Only active when using local H2 database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Razorpay Payment Gateway Configuration
# Provide RAZORPAY_KEY_ID & RAZORPAY_KEY_SECRET as environment variables or set them in .env
# If omitted or demo keys are left, RIMS operates in offline sandbox simulation mode
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_RIMSdemoKey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:RIMSdemoSecret123}
razorpay.currency=INR
razorpay.company.name=RIMS Equipment Rental

# Application Logging (Console + Rolling File Appender)
logging.file.name=logs/rims-application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.com.rims=INFO
logging.level.org.springframework.web=WARN
